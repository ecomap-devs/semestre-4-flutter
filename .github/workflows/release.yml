name: Release

# Publica uma versão do app quando alguém cria uma tag na main:
#
#   git tag v1.1.0 && git push origin v1.1.0
#
# Antes, a versão de pubspec.yaml precisa ser a da tag, com o número de build maior que o
# da release anterior (version: 1.1.0+2): o Android recusa atualização com número menor.
#
# Tag com hífen (v1.1.0-rc.1) é ensaio: a versão só precisa bater sem o sufixo, a tag não
# precisa estar na main, e o resultado é um rascunho, que não aparece para ninguém de
# fora. Apague o rascunho e a tag depois.
on:
  push:
    tags:
      - "v*.*.*"

# Dois jobs de propósito. `compilar` usa a chave de assinatura e roda código de dependências
# (pub, Gradle), então só lê o repositório. `publicar` pode escrever, não recebe a chave e
# não roda nada do projeto. A chave fica no ambiente `release`, que só aceita tags `v*`:
# um workflow em branch ou em PR não tem acesso a ela.
permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.0"
  # O certificado de release (SHA-256), que é público. Se a chave for trocada, o Android
  # recusa a atualização por cima do app instalado e a chave do Firebase precisa do novo
  # SHA-1: trocar este valor não é só mudar uma linha.
  CERTIFICADO_ESPERADO: 3e9bee1d461a5827c6f9a3222a0fcf3a778b71572d0459dcca98b2f483bff1ae

jobs:
  compilar:
    name: Compilar e assinar o APK
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    outputs:
      apk: ${{ steps.apk.outputs.nome }}
      sha256: ${{ steps.apk.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Conferir a versão
        run: |
          versao="${GITHUB_REF_NAME#v}"
          linha=$(grep -E '^version: ' pubspec.yaml)
          no_pubspec="${linha#version: }"
          nome="${no_pubspec%%+*}"
          build="${no_pubspec##*+}"
          if [ "$nome" != "${versao%%-*}" ]; then
            echo "::error::A tag é $GITHUB_REF_NAME, e o pubspec.yaml diz $no_pubspec"
            exit 1
          fi
          case "$GITHUB_REF_NAME" in
            *-*)
              echo "Ensaio: sem conferir a main nem o número de build."
              exit 0
              ;;
          esac
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::A tag precisa apontar para um commit da main"
            exit 1
          fi
          anterior=$(git tag --list 'v*.*.*' --merged "$GITHUB_SHA" --sort=-v:refname | grep -v -- - | grep -vx "$GITHUB_REF_NAME" | head -n 1 || true)
          if [ -n "$anterior" ]; then
            build_anterior=$(git show "$anterior:pubspec.yaml" | sed -n 's/^version: .*+//p' | tr -d '\r')
            if [ "$build" -le "$build_anterior" ]; then
              echo "::error::O número de build ($build) precisa ser maior que o da $anterior ($build_anterior)"
              exit 1
            fi
          fi

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Testar
        run: flutter test

      - name: Montar env.json a partir dos secrets
        env:
          FIREBASE_API_KEY_WEB: ${{ secrets.FIREBASE_API_KEY_WEB }}
          FIREBASE_API_KEY_ANDROID: ${{ secrets.FIREBASE_API_KEY_ANDROID }}
          FIREBASE_APP_ID_WEB: ${{ secrets.FIREBASE_APP_ID_WEB }}
          FIREBASE_APP_ID_ANDROID: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          # Secret ausente chega vazio, e o build compila liso: confere antes.
          faltando=""
          for v in FIREBASE_API_KEY_WEB FIREBASE_API_KEY_ANDROID FIREBASE_APP_ID_WEB FIREBASE_APP_ID_ANDROID FIREBASE_MESSAGING_SENDER_ID FIREBASE_PROJECT_ID FIREBASE_AUTH_DOMAIN FIREBASE_STORAGE_BUCKET SUPABASE_URL SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!v}" ]; then faltando="$faltando $v"; fi
          done
          if [ -n "$faltando" ]; then
            echo "::error::Secrets vazios ou ausentes:$faltando"
            exit 1
          fi
          jq -n '{
            FIREBASE_API_KEY_WEB: env.FIREBASE_API_KEY_WEB,
            FIREBASE_API_KEY_ANDROID: env.FIREBASE_API_KEY_ANDROID,
            FIREBASE_APP_ID_WEB: env.FIREBASE_APP_ID_WEB,
            FIREBASE_APP_ID_ANDROID: env.FIREBASE_APP_ID_ANDROID,
            FIREBASE_MESSAGING_SENDER_ID: env.FIREBASE_MESSAGING_SENDER_ID,
            FIREBASE_PROJECT_ID: env.FIREBASE_PROJECT_ID,
            FIREBASE_AUTH_DOMAIN: env.FIREBASE_AUTH_DOMAIN,
            FIREBASE_STORAGE_BUCKET: env.FIREBASE_STORAGE_BUCKET,
            SUPABASE_URL: env.SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY: env.SUPABASE_PUBLISHABLE_KEY
          }' > env.json

      - name: Montar a chave de assinatura
        env:
          CHAVE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PROPRIEDADES: ${{ secrets.ANDROID_KEY_PROPERTIES_BASE64 }}
        run: |
          if [ -z "$CHAVE" ] || [ -z "$PROPRIEDADES" ]; then
            echo "::error::A chave de assinatura não está no ambiente release"
            exit 1
          fi
          printf '%s' "$PROPRIEDADES" | base64 -d > android/key.properties
          arquivo=$(sed -n 's/^storeFile=//p' android/key.properties | tr -d '\r')
          mkdir -p "android/$(dirname "$arquivo")"
          printf '%s' "$CHAVE" | base64 -d > "android/$arquivo"

      - name: Compilar
        run: flutter build apk --release --dart-define-from-file=env.json

      - name: Conferir a assinatura e dar nome ao APK
        id: apk
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          origem=build/app/outputs/flutter-apk/app-release.apk
          saida=$("$apksigner" verify --print-certs "$origem")
          # O rótulo do assinante muda entre versões do apksigner ("Signer #1", "Signer
          # (minSdkVersion=...)"), e um APK pode ter mais de um: todos têm que ser o esperado.
          certificado=$(printf '%s\n' "$saida" | grep 'certificate SHA-256 digest: ' | sed 's/.*digest: //' | sort -u)
          if [ "$certificado" != "$CERTIFICADO_ESPERADO" ]; then
            printf '%s\n' "$saida"
            echo "::error::O APK não saiu assinado só com o certificado esperado: $certificado"
            exit 1
          fi
          nome="EcoMapBrasil-${GITHUB_REF_NAME#v}.apk"
          mv "$origem" "$nome"
          echo "nome=$nome" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$nome" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk
          path: ${{ steps.apk.outputs.nome }}
          if-no-files-found: error
          retention-days: 1

  publicar:
    name: Publicar a release
    needs: compilar
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk

      - name: Criar a release
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ needs.compilar.outputs.apk }}
          SHA256: ${{ needs.compilar.outputs.sha256 }}
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) ensaio=(--draft --prerelease) ;;
            *) ensaio=() ;;
          esac
          notas=$(printf 'Para instalar, baixe o `%s`, em **Assets**, num celular Android 7 ou mais novo, e permita a instalação se o Android pedir.\n\n**SHA-256 do APK:** `%s`\n' "$APK" "$SHA256")
          gh release create "$GITHUB_REF_NAME" "$APK" -R "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME: app Android do EcoMapBrasil" --notes "$notas" --generate-notes "${ensaio[@]}"
